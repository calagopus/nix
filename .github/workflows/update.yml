name: Update packages

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PAT }}

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update panel (stable)
        run: nix run nixpkgs#nix-update -- panel --flake --subpackage frontend --version-regex 'release-(.*)' --commit

      - name: Update panel-nightly
        run: nix run nixpkgs#nix-update -- panel-nightly --flake --version=branch=main --subpackage frontend --commit

      - name: Update fusequota
        run: nix run nixpkgs#nix-update -- fusequota --flake --version=branch=main --commit

      - name: Update wings (stable)
        run: nix run nixpkgs#nix-update -- wings --flake --version-regex 'release-(.*)' --commit

      - name: Update wings-nightly
        run: nix run nixpkgs#nix-update -- wings-nightly --flake --version=branch=main --commit

      - name: Update db-agent (stable)
        run: nix run nixpkgs#nix-update -- db-agent --flake --version-regex 'release-(.*)' --commit

      - name: Update db-agent-nightly
        run: nix run nixpkgs#nix-update -- db-agent-nightly --flake --version=branch=main --commit

      - name: Push changes
        run: git push
