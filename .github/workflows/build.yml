name: Build packages

on:
  push:

jobs:
  changes:
    if: "!contains(github.event.head_commit.message, '[ci-skip]')"
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            panel:
              - 'flake.nix'
              - 'flake.lock'
              - 'pkgs/panel/**'
            panel-nightly:
              - 'flake.nix'
              - 'flake.lock'
              - 'pkgs/panel-nightly/**'
            db-agent:
              - 'flake.nix'
              - 'flake.lock'
              - 'pkgs/db-agent/**'
            db-agent-nightly:
              - 'flake.nix'
              - 'flake.lock'
              - 'pkgs/db-agent-nightly/**'
            fusequota:
              - 'flake.nix'
              - 'flake.lock'
              - 'pkgs/fusequota/**'
            wings:
              - 'flake.nix'
              - 'flake.lock'
              - 'pkgs/wings/**'
              - 'pkgs/fusequota/**'
            wings-nightly:
              - 'flake.nix'
              - 'flake.lock'
              - 'pkgs/wings-nightly/**'
              - 'pkgs/fusequota/**'

  build:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: calagopus-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ${{ matrix.package }}
        run: nix build .#${{ matrix.package }}
